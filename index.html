<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poudreuse</title>
  <meta name="description" content="Poudreuse : gestion de station de ski en 3D isométrique, sur des massifs générés procéduralement.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="scene" aria-label="Domaine skiable en 3D isométrique"></div>

  <div class="brand">
    <h1>Poudreuse</h1>
    <div class="pistes" aria-hidden="true">
      <span style="background:var(--green)"></span><span style="background:var(--blue)"></span>
      <span style="background:var(--red)"></span><span style="background:var(--black)"></span>
    </div>
  </div>

  <div class="coin">
    <button class="horloge panel" id="horloge" aria-haspopup="true" aria-expanded="false" aria-controls="temps" title="Réglages du temps">
      <strong class="horloge-heure" id="horloge-heure">--:--</strong>
      <span class="horloge-ligne"><span id="horloge-date"></span> · <span id="horloge-saison"></span></span>
      <span class="horloge-ligne horloge-meteo"><span id="horloge-ciel"></span> · <span id="horloge-temp"></span></span>
    </button>

    <div class="temps panel" id="temps" role="group" aria-label="Réglages du temps" hidden>
      <p class="filtres-title">Journée</p>
      <div class="choix" role="radiogroup" aria-label="Journée">
        <label><input type="radio" name="journee" value="cycle"><span>Normal</span></label>
        <label><input type="radio" name="journee" value="jour"><span>Jour</span></label>
        <label><input type="radio" name="journee" value="nuit"><span>Nuit</span></label>
      </div>
      <p class="filtres-title">Saisons</p>
      <div class="choix" role="radiogroup" aria-label="Saisons">
        <label><input type="radio" name="saison" value="cycle"><span>Normal</span></label>
        <label><input type="radio" name="saison" value="hiver"><span>Hiver</span></label>
        <label><input type="radio" name="saison" value="ete"><span>Été</span></label>
      </div>
      <p class="temps-aide">Normal : jour puis nuit (5 min chacun) ; les quatre saisons, 20 min chacune.</p>
    </div>

    <div class="legende panel" id="legende" aria-live="polite" hidden>
      <div id="legende-risque" hidden>
        <strong>Risque d'avalanche</strong>
        <div class="niveaux"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
      </div>
      <div id="legende-proba" hidden>
        <strong>Probabilité de neige (3 jours)</strong>
        <div class="degrade"></div>
        <div class="bornes"><span>0 %</span><span>99 %</span></div>
      </div>
    </div>
  </div>

  <div class="loading" id="loading" aria-live="polite"><span class="panel">Génération du domaine…</span></div>

  <div class="confirm panel" id="confirm" role="group" aria-label="Construction" hidden>
    <div class="confirm-text">
      <strong id="confirm-title">Maisonnette</strong>
      <span id="confirm-hint" aria-live="polite"></span>
    </div>
    <div class="group">
      <button class="icon" id="confirm-rot" aria-label="Tourner le bâtiment (R)" title="Tourner (R)">⤾</button>
      <button id="confirm-cancel" title="Échap">Annuler</button>
      <button class="primary" id="confirm-ok" disabled title="Entrée">Confirmer</button>
    </div>
  </div>

  <div class="filtres panel" id="filtres" role="group" aria-label="Filtres d'affichage" hidden>
    <p class="filtres-title">Filtres</p>
    <label class="switch">
      <input type="checkbox" role="switch" id="filtre-topo">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">
        <strong>Topographie</strong>
        <span>Courbes de niveau tous les 10 m, marquées tous les 100 m · touche T</span>
      </span>
    </label>
    <label class="switch">
      <input type="checkbox" role="switch" id="filtre-risque">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">
        <strong>Risque d'avalanche</strong>
        <span>De 1 (vert) à 5 (violet), selon la pente et le manteau neigeux · touche A</span>
      </span>
    </label>
    <label class="switch">
      <input type="checkbox" role="switch" id="filtre-proba">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">
        <strong>Probabilité de neige</strong>
        <span>Chance qu'il neige sur le secteur en 3 jours, en moyenne de saison · touche N</span>
      </span>
    </label>
  </div>

  <div class="dock panel" role="toolbar" aria-label="Commandes">
    <div class="group">
      <button class="icon" id="rotL" aria-label="Tourner vers la gauche">⟲</button>
      <div class="compass" title="Nord" aria-hidden="true">
        <svg id="needle" width="24" height="24" viewBox="-12 -12 24 24">
          <polygon points="0,-10 4.5,2 0,0 -4.5,2" fill="#d23b3b"/>
          <polygon points="0,10 4.5,2 0,0 -4.5,2" fill="currentColor" opacity=".35"/>
        </svg>
      </div>
      <button class="icon" id="rotR" aria-label="Tourner vers la droite">⟳</button>
    </div>
    <span class="sep"></span>
    <div class="group" role="group" aria-label="Construire">
      <button class="icon" data-batiment="maisonnette" aria-pressed="false" aria-label="Construire une maisonnette" title="Maisonnette">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>
        </svg>
      </button>
    </div>
    <button class="icon" id="filtres-btn" aria-haspopup="true" aria-expanded="false" aria-controls="filtres" aria-label="Filtres d'affichage" title="Filtres">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M12 4 3 8.5 12 13l9-4.5z"/><path d="m3 12.5 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>
      </svg>
    </button>
    <span class="sep"></span>
    <div class="sizes" id="sizes" role="group" aria-label="Taille du massif">
      <button data-size="petit">Petit</button>
      <button data-size="moyen">Moyen</button>
      <button data-size="grand">Grand</button>
      <button data-size="immense">Immense</button>
    </div>
    <button class="primary" id="regen">Nouveau massif</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
